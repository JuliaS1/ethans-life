
<label for="word-emoji-search">Choose a picture</label>
<input
  id="word-emoji-search"
  type="search"
  placeholder="Search: dog, apple, car..."
  autocomplete="off"
>

<div id="emoji-results" class="emoji-results" aria-label="Emoji choices"></div>

<div class="emoji-preview">
  <span id="podglad-emoji" aria-hidden="true">🐶</span>
  <span>Your picture</span>
</div>

<input type="hidden" id="word-emoji" name="emoji" value="🐶">

<label for="word-english">English word</label>
<input
  id="word-english"
  name="word"
  maxlength="100"
  placeholder="e.g. dog"
  required
>

<label for="word-translation">Tłumaczenie</label>
<input
  id="word-translation"
  name="translation"
  maxlength="200"
  placeholder="np. pies"
  required
>
